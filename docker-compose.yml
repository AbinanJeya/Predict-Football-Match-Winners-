version: '3.8'

services:
  db:
    image: postgres:15
    container_name: football_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_match_data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: football_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/football_match_data
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - mlflow

volumes:
  postgres_data:
  mlflow_data:
